name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      models:
        description: Run model smoke tests
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm licenses:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-zip
          path: |
            playwright-report
            coverage
            .output/*.zip

  models:
    if: github.event_name == 'workflow_dispatch' && inputs.models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: models/cache
          key: models-${{ hashFiles('models/registry.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm models:fetch
      - run: pnpm test:models
